version: 1
approved: true
team: TECH

changes:

  - id: oam-new-1
    op: create_project
    name: "OAM: privacy protection for high-resolution imagery"
    description: "Reduce the risk of identifying people in very high-resolution uploads by blurring faces or reducing image detail."
    lead: cristiano.giovando@hotosm.org
    status: Planned
    startQuarter: 2027-Q2
    targetQuarter: 2027-Q3
    issues:
      - TECH-1399   # Add capability for downsampling high resolution imagery, or facial recognition and blurring algorithm (openaerialmap#382)
    why: >-
      Not previously on the roadmap. Imagery finer than 3 cm/px can make faces recognisable,
      which is a privacy risk now that cheap drones capture it. Planned ahead of more imagery types.
