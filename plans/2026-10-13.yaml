# Review process:
#   - Set `approved: true` when done, then:
#       node scripts/apply.js plans/2026-10-13.yaml            # dry run (default)
#       node scripts/apply.js plans/2026-10-13.yaml --apply    # write to Linear
#
# Sources: READMEs of drone-tm, openaerialmap, fAIr, field-tm, tasking-manager,
# osm-export-tool, k8s-infra (default branches, k8s-infra as of 2026-10-14), chatmap +
# portal (branch docs/user-roadmap-2026-q3), release tag dates, "2026 Q3 - HOT Tech -
# Quarterly Report Out", Sam's notes (2026-10-14), Linear state on 2026-10-14.
#
# Quarters: "2026-Q4" -> start 2026-10-01 / target 2026-12-31, resolution "quarter".
# Statuses: Backlog | Planned | In Progress | Completed | Canceled

